name: Release MCPB

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # actions/setup-node@v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run audit:high
      - run: npm run audit:tooling
      - run: npm run scan:secrets
      - run: npm run release:guard
      - run: npm run bundle
      - run: npm run bundle:verify
      - name: Publish checksummed MCPB
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/pir2-academy-sheets-reader-${GITHUB_REF_NAME#v}.mcpb"
          "dist/pir2-academy-sheets-reader-${GITHUB_REF_NAME#v}.mcpb.sha256"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "PiR2 Academy Sheets Reader ${GITHUB_REF_NAME}"
          --generate-notes
